<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="리필 스테이션 서비스 안내와 POS 등록·사용 안내">
  <link rel="canonical" href="https://refill.endet.xyz/">
  <title>리필 스테이션</title>
  <style>
    @font-face{font-family:Geist;src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
    :root{font-family:Geist,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:#172e29;background:#f0f5f1;line-height:1.6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,720px);padding:clamp(28px,7vw,56px);border:1px solid #d9e2dc;border-radius:16px;background:#fff;box-shadow:0 12px 36px #172e2910}
    img{display:block;width:164px;height:auto;margin-bottom:36px}h1{margin:0 0 28px;font-size:clamp(1.8rem,7vw,2.4rem);line-height:1.25;letter-spacing:-.04em}
    ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin:0;padding:0;list-style:none}a{display:block;padding:15px 18px;border:1px solid #d9e2dc;border-radius:8px;color:#172e29;font-weight:650;text-decoration:none}
    a:hover{border-color:#298263;background:#f0f5f1}a:focus-visible{outline:3px solid #298263;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="assets/aeonik-wordmark-brand-700.svg" alt="endet.">
    <h1>리필 스테이션</h1>
